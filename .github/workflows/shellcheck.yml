name: Shell Script Checks
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'backup'
      - 'tests/**'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backup'
      - 'tests/**'
      - '.github/workflows/shellcheck.yml'

jobs:
  shell-lint:
    uses: chorrell/workflows/.github/workflows/shell-lint.yml@v1
